<script>
const API_KEY = '' 

async function sendMsg() {
    let input = document.getElementById("userInput");
    let chat = document.getElementById("chat");
    if(input.value == "") return;
    let userText = input.value;
    chat.innerHTML += `<div class="msg user">👤 ${userText}</div>`;
    chat.innerHTML += `<div class="msg ai" id="loading">🤖 Soch raha hun...</div>`;
    input.value = "";
    
    try {
        let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + API_KEY
            },
            body: JSON.stringify({
                model: "llama-3.1-8b-instant",
                messages: [{role: "user", content: userText}]
            })
        });
        let data = await res.json();
        let aiReply = data.choices[0].message.content;
        document.getElementById("loading").innerHTML = `🤖 ${aiReply}`;
    } catch(e) {
        document.getElementById("loading").innerHTML = "🤖 Error aa gaya. Key check karo.";
    }
    chat.scrollTop = chat.scrollHeight;
}
</script>
