<!DOCTYPE html>

<html>
<head><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #101014;
  color: white;
  height: 100vh;
  overflow: hidden;
}

/* Header */
.header {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  border-bottom: 1px solid #292932;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  background: linear-gradient(90deg, #7c5cff, #00c8ff);
  -webkit-background-clip: text;
  color: transparent;
}

/* Chat */
#chat {
  height: calc(100vh - 145px);
  overflow-y: auto;
  padding: 20px 15px;
}

.message {
  max-width: 850px;
  margin: 12px auto;
  padding: 13px 16px;
  border-radius: 16px;
  line-height: 1.5;
  word-wrap: break-word;
}

.ai {
  background: #191920;
}

.user {
  background: #30303b;
}

/* Welcome */
.welcome {
  text-align: center;
  margin-top: 25vh;
}

.welcome h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

.welcome p {
  color: #aaa;
}

/* Input */
.bottom {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 12px;
  background: #101014;
}

.input-box {
  max-width: 850px;
  margin: auto;
  display: flex;
  align-items: center;
  background: #202027;
  border: 1px solid #34343d;
  border-radius: 20px;
  padding: 6px;
}

input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
  padding: 12px;
}

button {
  border: none;
  background: #705cff;
  color: white;
  border-radius: 15px;
  padding: 11px 17px;
  font-size: 15px;
}

button:active {
  transform: scale(0.95);
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">✦ My AI</div>
</div>

<div id="chat">

  <div class="welcome" id="welcome">
    <h1>👋 Hello!</h1>
    <p>What can I help you with?</p>
  </div>

</div>

<div class="bottom">
  <div class="input-box">

    <input
      id="input"
      type="text"
      placeholder="Ask My AI..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">➤</button>

  </div>
</div>

<script>

function sendMessage() {

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  const text = input.value.trim();

  if (text === "") return;

  if (welcome) {
    welcome.remove();
  }

  // User message
  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.innerText = text;

  chat.appendChild(userMessage);

  input.value = "";

  // Temporary AI response
  setTimeout(() => {

    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";

    aiMessage.innerText =
      "🤖 My AI: Abhi main demo mode mein hoon. Real AI answers ke liye AI API connect karni hogi.";

    chat.appendChild(aiMessage);

    chat.scrollTop = chat.scrollHeight;

  }, 600);

  chat.scrollTop = chat.scrollHeight;
}


// Enter button
document.getElementById("input").addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

});

</script>

</body>
</html>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Hello, World!</title>
</head>
<body>
  <h1>
    Hello, World!
  </h1>
</body>
</html>
